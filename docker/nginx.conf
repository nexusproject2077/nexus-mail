server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The app is a Next.js static export with trailingSlash, so routes resolve to
  # `<route>/index.html`. Fall back to the SPA entry for unknown paths.
  location / {
    try_files $uri $uri/ $uri.html /index.html;
  }

  # Long-cache immutable Next assets.
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
